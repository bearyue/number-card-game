<!DOCTYPE html>
<html lang="zh-CN">

<title>儿童认数字卡牌游戏</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Comic Sans MS","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fff3b0,#ffd6e8,#c8f7dc);display:flex;justify-content:center;align-items:center;color:#333}.game{width:min(1280px,96vw);min-height:92vh;background:rgba(255,255,255,.92);border-radius:34px;box-shadow:0 18px 50px rgba(0,0,0,.16);padding:30px;position:relative;overflow:hidden}h1{text-align:center;margin:0 0 18px;color:#ff7a59;font-size:40px}.settings{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;background:#fff7d6;padding:18px;border-radius:22px;margin-bottom:14px;border:3px dashed #ffcf5a}.setting-item{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:bold}.range-fixed{background:#fff;border:2px solid #ffb347;border-radius:14px;padding:8px 12px;color:#ff7a59}.check-item input{width:22px;height:22px;accent-color:#43e97b}input,button{font-family:inherit;font-size:17px;border-radius:14px;border:2px solid #ffb347;padding:8px 12px;background:#fff}button{cursor:pointer;border:none;background:linear-gradient(135deg,#ff9a76,#ffcf5a);color:#fff;font-weight:bold;box-shadow:0 5px 0 #dd8b22;transition:.15s}button:active{transform:translateY(4px);box-shadow:0 1px 0 #dd8b22}.sound-btn{background:linear-gradient(135deg,#5d6dff,#8fd3f4);box-shadow:0 5px 0 #4051cc}.sound-btn.on{background:linear-gradient(135deg,#43e97b,#38f9d7);box-shadow:0 5px 0 #1fa76a}.sound-tip{text-align:center;font-size:16px;font-weight:bold;color:#777;margin:0 0 8px}.sound-tip.on{color:#1fa76a}.sound-tip.warn{color:#ff6b6b}.status{text-align:center;font-size:24px;font-weight:bold;margin:10px 0 16px;color:#5d6dff;min-height:34px}.judge-panel{width:min(620px,94vw);margin:0 auto 14px;padding:14px;border-radius:22px;background:#f1f7ff;border:3px solid rgba(93,109,255,.18);display:none;justify-content:center;align-items:center;gap:16px;text-align:center}.judge-panel.show{display:flex}.judge-tip{font-size:20px;font-weight:bold;color:#4d5bd1}.judge-btn{min-width:110px;font-size:20px;padding:10px 18px}.correct-btn{background:linear-gradient(135deg,#43e97b,#38f9d7);box-shadow:0 5px 0 #1fa76a}.wrong-btn{background:linear-gradient(135deg,#ff6b6b,#ff9a76);box-shadow:0 5px 0 #c94b4b}.chase{width:min(900px,94vw);margin:0 auto 18px;padding:10px 14px 12px;border-radius:22px;background:#fff7d6;border:3px solid #ffdf8a;display:none}.chase.show{display:block}.chase-info{display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:#ff7a59;margin-bottom:8px}.track{height:54px;border-radius:999px;background:linear-gradient(90deg,#d8f7ff,#eaffd8,#fff2c6);border:4px solid #fff;box-shadow:inset 0 2px 8px rgba(0,0,0,.12);position:relative;overflow:hidden}.path{position:absolute;left:28px;right:28px;top:50%;border-top:4px dashed rgba(100,100,100,.35);transform:translateY(-50%)}.finish-flag{position:absolute;right:20px;top:4px;font-size:24px;z-index:1}.rabbit,.turtle{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:34px;z-index:2;transition:left .08s linear}.rabbit{left:92%}.turtle{left:8%}.rabbit.sleeping{animation:sleepy 1.1s ease-in-out infinite alternate}.rabbit.escaped{animation:escape .8s ease forwards}.turtle.caught{animation:caught .5s ease infinite alternate}.cards{width:min(900px,94vw);margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,285px);gap:28px}.card{height:285px;position:relative;cursor:pointer;transition:transform .35s ease,opacity .35s ease}.card.locked{cursor:default}.card.shuffling{transform:scale(.92) rotate(2deg);opacity:.6}.empty-slot{height:285px;border-radius:28px;border:4px dashed rgba(255,179,71,.35);background:rgba(255,255,255,.35)}.card-face{position:absolute;inset:0;border-radius:28px;box-shadow:0 11px 24px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;border:7px solid #fff}.card-back{background:linear-gradient(135deg,#7cc7ff,#a78bfa);animation:cardIn .25s ease}.card-back:before{content:"?";font-size:110px;color:#fff;font-weight:bold;text-shadow:0 6px 0 rgba(0,0,0,.18)}.card-back:after{content:"点我认数字";position:absolute;bottom:28px;color:#fff;font-size:21px;font-weight:bold}.card-front{display:none;padding:14px;animation:reveal .35s ease}.card.revealed .card-back{display:none}.card.revealed .card-front{display:flex}.card.passed .card-front{outline:6px solid rgba(67,233,123,.58)}.number{font-size:76px;font-weight:900;line-height:1;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.15);margin-bottom:10px}.objects{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:9px;padding:8px;min-height:112px;max-width:100%}.object{font-size:38px;animation:pop .45s ease both}.theme-name{font-size:20px;color:#fff;font-weight:bold;background:rgba(255,255,255,.22);padding:6px 14px;border-radius:999px}.passed-badge{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.94);display:none;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 10px rgba(0,0,0,.16);z-index:3}.card.passed .passed-badge{display:flex}.correct-celebration,.celebration{position:absolute;inset:0;background:rgba(255,255,255,.9);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;text-align:center;padding:30px}.correct-celebration.show,.celebration.show{display:flex;animation:fadeIn .35s ease}.correct-box{width:min(560px,92vw);border-radius:34px;background:linear-gradient(135deg,#fff7d6,#ffd6e8);border:8px solid #fff;box-shadow:0 18px 44px rgba(0,0,0,.18);padding:34px 24px;animation:bigPop .45s ease both}.correct-stars,.stars{font-size:54px;animation:bounce .8s infinite alternate}.correct-title,.celebration h2{font-size:52px;color:#ff7a59;margin:10px 0}.correct-message,.celebration p{font-size:30px;font-weight:bold;color:#5d6dff;margin:8px 0 22px}.continue-btn{font-size:22px;padding:12px 26px}.confetti{position:absolute;width:12px;height:18px;top:-20px;animation:fall 2.6s linear forwards;border-radius:4px;z-index:20}@keyframes sleepy{from{transform:translate(-50%,-50%) rotate(-4deg)}to{transform:translate(-50%,-50%) rotate(4deg)}}@keyframes escape{to{left:115%;transform:translate(-50%,-50%) scale(1.2)}}@keyframes caught{from{transform:translate(-50%,-50%) rotate(-8deg)}to{transform:translate(-50%,-50%) rotate(8deg)}}@keyframes cardIn{from{transform:scale(.96);opacity:.7}to{transform:scale(1);opacity:1}}@keyframes reveal{from{transform:scale(.88) rotate(-2deg);opacity:.2}to{transform:scale(1) rotate(0);opacity:1}}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes bigPop{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes bounce{from{transform:translateY(0) scale(1)}to{transform:translateY(-14px) scale(1.08)}}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@media(max-width:700px){body{align-items:flex-start}.game{width:100vw;min-height:100vh;padding:14px;border-radius:0}h1{font-size:28px;margin-bottom:12px}.settings{padding:12px;gap:10px;margin-bottom:10px}.setting-item{font-size:15px}.range-fixed,input,button{font-size:15px;padding:7px 9px}.check-item input{width:18px;height:18px}.sound-tip{font-size:14px}.status{font-size:18px;margin:10px 0 12px}.judge-panel{width:100%;padding:10px;margin-bottom:10px;gap:10px;flex-wrap:wrap}.judge-tip{width:100%;font-size:16px}.judge-btn{min-width:96px;font-size:17px;padding:9px 14px}.chase{width:100%;padding:8px;margin-bottom:12px}.track{height:44px}.rabbit,.turtle{font-size:28px}.finish-flag{font-size:20px;right:14px}.cards{width:100%;grid-template-rows:repeat(3,180px);gap:12px}.card,.empty-slot{height:180px}.card-face{border-radius:20px;border-width:5px}.card-back:before{font-size:68px}.card-back:after{font-size:14px;bottom:18px}.card-front{padding:8px}.number{font-size:50px;margin-bottom:6px}.objects{min-height:68px;gap:4px;padding:3px}.object{font-size:25px}.theme-name{font-size:14px;padding:4px 8px}.passed-badge{width:32px;height:32px;font-size:20px;top:8px;right:8px}.correct-title,.celebration h2{font-size:40px}.correct-message,.celebration p{font-size:24px}.correct-stars,.stars{font-size:42px}}
</style>
</head>
<body>
<main class="game">
<h1>数字卡牌小乐园</h1>
<section class="settings"><div class="setting-item"><span>数字范围</span><strong class="range-fixed">1 ~ 9</strong></div><div class="setting-item"><label for="count">学习几个数字</label><input id="count" type="number" min="1" max="9" value="5" /></div><div class="setting-item check-item"><input id="raceEnabled" type="checkbox" /><label for="raceEnabled">开启龟兔赛跑倒计时</label></div><div class="setting-item"><label for="timeLimit">答题时间</label><input id="timeLimit" type="number" min="5" max="120" value="30" /> 秒</div><button id="soundBtn" class="sound-btn">🔊 开启声音</button><button id="startBtn">开始游戏</button></section>
<div class="sound-tip warn" id="soundTip">请先点“开启声音”。听到“声音已开启”后，答对/答错/庆祝才会播放声音。</div>
<div class="status" id="status">龟兔赛跑倒计时默认关闭。需要紧张感时可勾选开启。</div>
<section class="judge-panel" id="judgePanel"><div class="judge-tip" id="judgeTip">小朋友答对了吗？</div><button class="judge-btn correct-btn" id="correctBtn">答对了</button><button class="judge-btn wrong-btn" id="wrongBtn">答错了</button></section>
<section class="chase" id="chase"><div class="chase-info"><span id="chaseText">龟兔赛跑开始啦</span><span id="timeLeft">30.0 秒</span></div><div class="track"><div class="path"></div><div class="finish-flag">🏁</div><div class="turtle" id="turtle">🐢</div><div class="rabbit sleeping" id="rabbit">🐰💤</div></div></section>
<section class="cards" id="cards"></section>
<section class="correct-celebration" id="correctCelebration"><div class="correct-box"><div class="correct-stars">🌟 🎈 🎉</div><h2 class="correct-title">答对啦！</h2><p class="correct-message" id="correctMessage">恭喜你答对了！</p><button class="continue-btn" id="continueBtn">继续</button></div></section>
<section class="celebration" id="celebration"><div class="stars">🌟 🎉 🏆 🎉 🌟</div><h2>太棒啦！</h2><p id="finalMessage">你完成了所有数字卡牌！</p><button id="againBtn">再玩一次</button></section>
</main>
<script>
const countInput=document.getElementById("count"),raceEnabledInput=document.getElementById("raceEnabled"),timeLimitInput=document.getElementById("timeLimit"),soundBtn=document.getElementById("soundBtn"),soundTip=document.getElementById("soundTip"),startBtn=document.getElementById("startBtn"),againBtn=document.getElementById("againBtn"),cardsContainer=document.getElementById("cards"),statusText=document.getElementById("status"),celebration=document.getElementById("celebration"),finalMessage=document.getElementById("finalMessage"),judgePanel=document.getElementById("judgePanel"),judgeTip=document.getElementById("judgeTip"),correctBtn=document.getElementById("correctBtn"),wrongBtn=document.getElementById("wrongBtn"),correctCelebration=document.getElementById("correctCelebration"),correctMessage=document.getElementById("correctMessage"),continueBtn=document.getElementById("continueBtn"),chase=document.getElementById("chase"),chaseText=document.getElementById("chaseText"),timeLeftEl=document.getElementById("timeLeft"),turtle=document.getElementById("turtle"),rabbit=document.getElementById("rabbit");
const themes={1:{e:"🐰",n:"一只小兔",b:"linear-gradient(135deg,#ff9a9e,#fad0c4)"},2:{e:"🍎",n:"两个苹果",b:"linear-gradient(135deg,#f5576c,#f093fb)"},3:{e:"⭐",n:"三颗星星",b:"linear-gradient(135deg,#f6d365,#fda085)"},4:{e:"🐟",n:"四条小鱼",b:"linear-gradient(135deg,#4facfe,#00f2fe)"},5:{e:"🌸",n:"五朵小花",b:"linear-gradient(135deg,#ffecd2,#fcb69f)"},6:{e:"🚗",n:"六辆小车",b:"linear-gradient(135deg,#43e97b,#38f9d7)"},7:{e:"🦋",n:"七只蝴蝶",b:"linear-gradient(135deg,#a18cd1,#fbc2eb)"},8:{e:"🍭",n:"八根棒棒糖",b:"linear-gradient(135deg,#84fab0,#8fd3f4)"},9:{e:"🎈",n:"九个气球",b:"linear-gradient(135deg,#fa709a,#fee140)"}},names=["","一","二","三","四","五","六","七","八","九"];
let selected=[],correctCount=0,activeCard=null,activeNumber=null,audioContext=null,masterGain=null,waiting=false,finished=false,pendingFinish=false,autoCloseTimer=null,soundReady=false,isShuffling=false,timerId=null,timerStart=0,timerLimit=30;
function raceOn(){return raceEnabledInput.checked}
function createAudio(){if(!audioContext){audioContext=new(window.AudioContext||window.webkitAudioContext)();masterGain=audioContext.createGain();masterGain.gain.value=.95;masterGain.connect(audioContext.destination)}return audioContext}
async function unlockSound(){try{const ctx=createAudio();if(ctx.state!=="running")await ctx.resume();soundReady=true;soundBtn.textContent="🔊 声音已开启";soundBtn.classList.add("on");soundTip.textContent="声音已开启。点这个按钮可以再次测试声音。";soundTip.className="sound-tip on";testSound();setTimeout(()=>speak("声音已开启"),260)}catch(e){soundReady=false;soundTip.textContent="声音开启失败。请检查浏览器或系统是否静音。";soundTip.className="sound-tip warn"}}
function tone(f,d,t="sine",v=.6,delay=0){if(!audioContext||!masterGain)return;const start=audioContext.currentTime+delay,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(v,start+.02);g.gain.exponentialRampToValueAtTime(.001,start+d);o.connect(g);g.connect(masterGain);o.start(start);o.stop(start+d+.04)}
function testSound(){createAudio();tone(523,.24,"sine",.65);tone(784,.28,"sine",.65,.28)}function ensureSound(){if(!soundReady){soundTip.textContent="还没有开启声音。请先点上方“开启声音”。";soundTip.className="sound-tip warn";return false}return true}function speak(text){if(!soundReady||!("speechSynthesis" in window))return;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";u.rate=.85;u.pitch=1.15;u.volume=1;window.speechSynthesis.speak(u)}catch(e){}}
function flipSound(){if(!ensureSound())return;tone(520,.12,"triangle",.55);tone(720,.14,"triangle",.55,.12)}function correctSound(n){if(!ensureSound())return;tone(523,.18,"sine",.7);tone(659,.18,"sine",.7,.18);tone(784,.22,"sine",.7,.36);tone(1046,.28,"sine",.65,.58);setTimeout(()=>speak(raceOn()?`恭喜你，答对了数字${names[n]}，小白兔醒来跑走了`:`恭喜你，答对了数字${names[n]}`),160)}function wrongSound(){if(!ensureSound())return;tone(260,.24,"square",.38);tone(196,.3,"square",.34,.22)}function timeoutSound(){if(!ensureSound())return;tone(180,.3,"sawtooth",.4);tone(140,.36,"sawtooth",.34,.28);setTimeout(()=>speak("时间到，小乌龟追上睡觉的小白兔了"),120)}function shuffleSound(){if(!ensureSound())return;tone(330,.08,"triangle",.35);tone(440,.08,"triangle",.35,.08);tone(550,.08,"triangle",.35,.16)}function successSound(){if(!ensureSound())return;[523,659,784,1046,1318].forEach((n,i)=>tone(n,.24,"sine",.68,i*.18));setTimeout(()=>speak("太棒啦，你完成了所有数字卡牌"),520)}
function rangeNums(){return [1,2,3,4,5,6,7,8,9]}function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function startGame(){stopTimer(false);clearTimeout(autoCloseTimer);if(window.speechSynthesis)window.speechSynthesis.cancel();celebration.classList.remove("show");correctCelebration.classList.remove("show");judgePanel.classList.remove("show");cardsContainer.innerHTML="";correctCount=0;activeCard=null;activeNumber=null;waiting=false;finished=false;pendingFinish=false;isShuffling=false;let count=Number(countInput.value);if(!count||count<1)count=1;if(count>9)count=9;countInput.value=count;timerLimit=Number(timeLimitInput.value);if(!timerLimit||timerLimit<5)timerLimit=5;if(timerLimit>120)timerLimit=120;timeLimitInput.value=timerLimit;selected=shuffle(rangeNums()).slice(0,count);statusText.textContent=raceOn()?`一共有 ${count} 张大卡牌。翻开后有 ${timerLimit} 秒判断时间！`:`一共有 ${count} 张大卡牌。翻开后由大人判断答对或答错。`;selected.forEach(n=>cardsContainer.appendChild(makeCard(n)));for(let i=0;i<9-selected.length;i++){const e=document.createElement("div");e.className="empty-slot";cardsContainer.appendChild(e)}}
function makeCard(n){const t=themes[n],card=document.createElement("div"),back=document.createElement("div"),front=document.createElement("div"),badge=document.createElement("div"),num=document.createElement("div"),objs=document.createElement("div"),title=document.createElement("div");card.className="card";card.dataset.passed="false";card.dataset.number=String(n);back.className="card-face card-back";front.className="card-face card-front";front.style.background=t.b;badge.className="passed-badge";badge.textContent="✓";num.className="number";num.textContent=n;objs.className="objects";for(let i=0;i<n;i++){const item=document.createElement("span");item.className="object";item.textContent=t.e;item.style.animationDelay=`${i*.06}s`;objs.appendChild(item)}title.className="theme-name";title.textContent=t.n;front.append(badge,num,objs,title);card.append(back,front);card.addEventListener("click",()=>{if(finished||waiting||isShuffling||card.dataset.passed==="true"||card.classList.contains("revealed"))return;flipSound();card.classList.add("revealed");activeCard=card;activeNumber=n;waiting=true;if(raceOn()){statusText.textContent=`这张是数字 ${n}。请在 ${timerLimit} 秒内判断是否答对。`;startTimer()}else{statusText.textContent=`这张是数字 ${n}。请让小朋友回答，然后由大人判断。`}judgeTip.textContent=`小朋友答数字 ${n}，答对了吗？`;judgePanel.classList.add("show")});return card}
function startTimer(){stopTimer(false);timerStart=performance.now();chase.classList.add("show");rabbit.textContent="🐰💤";rabbit.classList.add("sleeping");rabbit.classList.remove("escaped");turtle.classList.remove("caught");turtle.style.left="8%";rabbit.style.left="92%";tickTimer()}
function tickTimer(){if(!waiting||!raceOn())return;const elapsed=(performance.now()-timerStart)/1000,p=Math.min(elapsed/timerLimit,1),left=Math.max(timerLimit-elapsed,0);turtle.style.left=(8+p*82)+"%";timeLeftEl.textContent=left.toFixed(1)+" 秒";chaseText.textContent=p<.75?"龟兔赛跑：小白兔在终点睡觉，小乌龟慢慢追！":"快点判断！小乌龟快追上睡觉的小白兔了！";if(p>=1){handleTimeout();return}timerId=requestAnimationFrame(tickTimer)}
function stopTimer(showEscape){if(timerId){cancelAnimationFrame(timerId);timerId=null}if(showEscape&&raceOn()){rabbit.textContent="🐰💨";rabbit.classList.remove("sleeping");rabbit.classList.add("escaped");chaseText.textContent="小白兔醒来跑走啦！";timeLeftEl.textContent="成功";setTimeout(()=>{if(!waiting)chase.classList.remove("show")},900)}else{chase.classList.remove("show");rabbit.textContent="🐰💤";rabbit.classList.add("sleeping");rabbit.classList.remove("escaped");turtle.classList.remove("caught")}}
function handleTimeout(){if(!activeCard||!waiting||!raceOn())return;turtle.classList.add("caught");rabbit.classList.remove("sleeping");rabbit.textContent="😴🐰";timeLeftEl.textContent="时间到";chaseText.textContent="小乌龟追上睡觉的小白兔了！";timeoutSound();processWrong(activeCard,activeNumber,true)}
function markCorrect(){if(!activeCard||!waiting)return;const card=activeCard,n=activeNumber;stopTimer(raceOn());correctSound(n);card.classList.add("revealed","passed","locked");card.dataset.passed="true";correctCount++;waiting=false;activeCard=null;activeNumber=null;judgePanel.classList.remove("show");const left=selected.length-correctCount;pendingFinish=left===0;correctMessage.textContent=raceOn()?`恭喜你答对了数字 ${n}！小白兔醒来跑走啦！`:`恭喜你答对了数字 ${n}！`;correctCelebration.classList.add("show");miniConfetti();statusText.textContent=left>0?`答对了！这张通过了。还剩 ${left} 张。`:"最后一张也答对了！先庆祝一下！";clearTimeout(autoCloseTimer);autoCloseTimer=setTimeout(closeCorrect,3400)}
function closeCorrect(){clearTimeout(autoCloseTimer);correctCelebration.classList.remove("show");if(pendingFinish){pendingFinish=false;finished=true;setTimeout(finishGame,500)}}
function markWrong(){if(!activeCard||!waiting)return;wrongSound();processWrong(activeCard,activeNumber,false)}
function processWrong(card,n,isTimeout){waiting=false;activeCard=null;activeNumber=null;judgePanel.classList.remove("show");if(!isTimeout)stopTimer(false);statusText.textContent=isTimeout?`时间到！数字 ${n} 按答错处理，卡牌会翻回并换位置。`:`数字 ${n} 答错了，卡牌会翻回去，然后和其他未揭开的卡牌换位置。`;setTimeout(()=>card.classList.remove("revealed"),450);setTimeout(()=>shuffleWrongCard(card),850);setTimeout(()=>{if(!finished){stopTimer(false);statusText.textContent=`还剩 ${selected.length-correctCount} 张需要答对。请选择一张卡牌继续。`}},1800)}
function shuffleWrongCard(card){const candidates=[...cardsContainer.querySelectorAll(".card")].filter(c=>c!==card&&c.dataset.passed!=="true"&&!c.classList.contains("revealed"));if(candidates.length===0)return;const other=candidates[Math.floor(Math.random()*candidates.length)];isShuffling=true;card.classList.add("shuffling");other.classList.add("shuffling");shuffleSound();setTimeout(()=>{swapElements(card,other);card.classList.remove("shuffling");other.classList.remove("shuffling");isShuffling=false},360)}
function swapElements(a,b){const parent=a.parentNode,marker=document.createElement("span"),aNext=a.nextSibling,bNext=b.nextSibling;parent.insertBefore(marker,a);if(aNext===b){parent.insertBefore(a,bNext);parent.insertBefore(b,marker)}else if(bNext===a){parent.insertBefore(b,aNext);parent.insertBefore(a,marker)}else{parent.insertBefore(a,bNext);parent.insertBefore(b,marker)}parent.removeChild(marker)}
function finishGame(){stopTimer(false);successSound();finalMessage.textContent=`你答对了 ${selected.length} 张数字卡牌，真厉害！`;celebration.classList.add("show");confetti(90,3600)}
function confetti(count,life){const colors=["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93"];for(let i=0;i<count;i++){const p=document.createElement("div");p.className="confetti";p.style.left=Math.random()*100+"%";p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDelay=Math.random()*.8+"s";p.style.animationDuration=1.8+Math.random()*1.4+"s";document.body.appendChild(p);setTimeout(()=>p.remove(),life)}}function miniConfetti(){confetti(32,2400)}
soundBtn.addEventListener("click",unlockSound);startBtn.addEventListener("click",startGame);againBtn.addEventListener("click",startGame);correctBtn.addEventListener("click",markCorrect);wrongBtn.addEventListener("click",markWrong);continueBtn.addEventListener("click",closeCorrect);raceEnabledInput.addEventListener("change",()=>{stopTimer(false);statusText.textContent=raceOn()?"已开启龟兔赛跑倒计时。翻开卡牌后会开始计时。":"已关闭龟兔赛跑倒计时。翻开卡牌后不会自动超时。"});startGame();
</script>
